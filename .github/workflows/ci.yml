name: bundle

# Validate the bundle manifest (structure + pins exist), and — on a schedule — open a
# PR when a member cuts a newer release tag (ADR 0049 pin lifecycle). This bundle skips
# the heavy "install into a fresh protoAgent and probe views" leg from the template:
# the member plugins each carry their own test suite, so the bundle's job is to keep the
# pin set well-formed and current.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly, Monday 06:17 UTC — surface a rotted/outdated pin set

permissions:
  contents: write
  pull-requests: write
  issues: write # labeling the pin-bump PR (`gh pr edit --add-label`) rides the issues API
  actions: read # `gh run list`, to detect the approval-required stall below

jobs:
  validate:
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate manifest + pins
        run: python3 scripts/validate_bundle.py protoagent.bundle.yaml

  # ONE candidate at a time (#2645), and the GITHUB_TOKEN approval-required stall made
  # visible instead of silent — same contract as the other 3 archetype repos and the protoAgent
  # template, see README.md "Pin-bump PR lifecycle". Logic lives in
  # scripts/bump_pins_pr.sh (#2669) — a real, unit-tested script rather than inline
  # YAML bash. This job's OWN `validate` step above stays the lighter
  # manifest-structure-only contract (deliberate, see the file header comment) — only
  # the `bump` job's PR-lifecycle bug is shared with the other archetype repos.
  bump:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ vars.NSC_RUNNER || 'namespace-profile-protolabs-linux' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tag-pinned members for newer releases
        id: check
        run: |
          python3 scripts/check_bundle_updates.py protoagent.bundle.yaml | tee "${BUMP_PINS_SCRATCH_DIR:-/tmp}/bumps.txt"
          echo "changed=$(git diff --quiet && echo false || echo true)" >> "$GITHUB_OUTPUT"
      - name: Open or update the pin-bump PR
        if: steps.check.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/scripts/bump_pins_pr.sh" open-or-update
      - name: Flag the approval-required verify run
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # This bundle's pin-bump job lives in ci.yml (this file), not verify-bundle.yml
          # like the other 3 archetype repos — the poll must search the workflow THIS repo
          # actually runs, or it always reports the run as never showing up.
          BUMP_PINS_WORKFLOW_FILE: ci.yml
        run: >
          bash "$GITHUB_WORKSPACE/scripts/bump_pins_pr.sh" flag-approval
          "${{ steps.pr.outputs.number }}" "${{ steps.pr.outputs.branch }}" "${{ steps.pr.outputs.sha }}"
